<!DOCTYPE html>
<html>
<head>
<title>Secret Sky ✨</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: sans-serif;
}

#text {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
}

canvas {
  display: block;
}

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% {transform: translateX(0);}
  25% {transform: translateX(-5px);}
  50% {transform: translateX(5px);}
  75% {transform: translateX(-5px);}
  100% {transform: translateX(0);}
}
</style>
</head>

<body>

<div id="text">draw the constellation ✧</div>
<canvas id="canvas"></canvas>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [
  {x: 400, y: 200},
  {x: 500, y: 150},
  {x: 600, y: 200},
  {x: 550, y: 300},
  {x: 450, y: 300}
];

const correctPattern = [0,1,2,3,4];
let userPattern = [];
let progress = 0;

// ✨ background twinkle
const bgStars = Array.from({length: 120}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  alpha: Math.random(),
  speed: Math.random() * 0.02
}));

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  bgStars.forEach(s => {
    s.alpha += s.speed;
    if (s.alpha > 1 || s.alpha < 0) s.speed *= -1;

    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fillRect(s.x, s.y, 2, 2);
  });

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.beginPath();

  userPattern.forEach((index,i)=>{
    const star = stars[index];
    if(i===0){
      ctx.moveTo(star.x,star.y);
    } else {
      const prev = stars[userPattern[i-1]];
      const t = Math.min(progress,1);
      const x = prev.x + (star.x - prev.x)*t;
      const y = prev.y + (star.y - prev.y)*t;
      ctx.lineTo(x,y);
    }
  });

  ctx.stroke();

  stars.forEach((star,i)=>{
    ctx.beginPath();
    ctx.arc(star.x,star.y,6,0,Math.PI*2);

    if(userPattern.includes(i)){
      ctx.shadowBlur = 20;
      ctx.fillStyle = "#fff";
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#888";
    }

    ctx.fill();
    ctx.shadowBlur = 0;
  });

  requestAnimationFrame(draw);
}
draw();

function handleInput(x,y){
  stars.forEach((star,i)=>{
    const dx = x-star.x;
    const dy = y-star.y;
    if(Math.sqrt(dx*dx+dy*dy)<20 && !userPattern.includes(i)){
      userPattern.push(i);
      progress = 0;

      let anim = setInterval(()=>{
        progress += 0.1;
        if(progress>=1) clearInterval(anim);
      },16);

      checkPattern();
    }
  });
}

canvas.addEventListener("click", e=>{
  handleInput(e.clientX,e.clientY);
});

canvas.addEventListener("touchstart", e=>{
  const t = e.touches[0];
  handleInput(t.clientX,t.clientY);
});

function checkPattern(){
  if(userPattern.length===correctPattern.length){
    if(JSON.stringify(userPattern)===JSON.stringify(correctPattern)){
      text.innerText="unlocking ✧";
      setTimeout(()=>window.location.href="sky.html",800);
    } else {
      text.classList.add("shake");
      setTimeout(()=>text.classList.remove("shake"),300);

      setTimeout(()=>{
        userPattern=[];
      },600);
    }
  }
}
</script>

</body>
</html>
